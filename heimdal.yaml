packages:
  common:
  - zsh
  homebrew: []
  homebrew_casks: []
  apt:
  - firefox
  - tailscale
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - code
  - dbeaver-ce
  - 1password
  - typora
  - redis-insight
  dnf:
  - firefox
  - tailscale
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - code
  - dbeaver-ce
  - 1password
  pacman:
  - firefox
  - tailscale
  - docker
  - code
  - obsidian
  apk:
  - firefox
  - tailscale
  - docker
  mas: []
toolchains:
  npm: []
  cargo: []
  go: []
  gem: []
  pip: []
ignore:
- .git
- .gitignore
- heimdal.yaml
- .stowrc
- '*.md'
- LICENSE
- .DS_Store
- .config/yarn/global/node_modules
history: null
hooks:
  pre_apply:
  - command: 'brew list --cask google-chrome >/dev/null 2>&1 || brew install --cask --adopt google-chrome'
    description: Adopt a manually installed Chrome into Homebrew
    os: [macos]
    fail_on_error: false
  post_apply:
  - command: '[ -x "$HOME/.local/bin/uv" ] && [ -f "$HOME/.local/bin/env" ] || curl -LsSf https://astral.sh/uv/install.sh | sh'
    description: Install uv (also creates ~/.local/bin/env, sourced by .zshrc)
    os: []
    fail_on_error: false
  - command: if command -v nvim >/dev/null 2>&1; then nvim --headless "+Lazy! restore" +qa && nvim --headless "+Lazy! load mason-tool-installer.nvim" "+MasonToolsInstallSync" +qa; fi
    description: Install Neovim plugins at lazy-lock.json versions, then Mason LSPs/formatters
    os: []
    fail_on_error: false
  pre_sync: []
  post_sync: []
defaults: null
parallel_jobs: 4
