heimdal:
  version: "1"
  repo: git@github.com/limistah/dotfiles.git

profiles:
  work:
    dotfiles: []
    packages:
      homebrew:
        # Development tools
        - neovim
        - tmux
        - sesh
        - fd
        - tree-sitter-cli
        - fzf
        - ripgrep
        - tree
        - zoxide
        - lazygit
        - gh
        - stow
        - bash
        - yazi

        # Programming languages
        - go
        - rust
        - zig
        - python@3.14
        - llvm
        - luarocks

        # Build tools
        - cmake
        - pkgconf
        - protobuf
        - golangci-lint

        # CLI utilities
        - btop
        - wget
        - yamlfmt
        - grpcurl
        - mas
        - ast-grep
        - sesh
        - rainfrog
        - zsh-completions
        - jq
        - sevenzip

        # Database/Backend
        - supabase/tap/supabase

        # Static site generation
        - hugo

        # Security
        - gnupg
        - gpgme

        # Networking
        - tailscale

        # Media/Graphics
        - ffmpeg
        - ffmpeg-full
        - imagemagick-full
        - poppler
        - resvg

        # Deployment
        - 1broseidon/tap/ketch

        # AI agents
        - herdr

      homebrew_casks:
        # Terminals
        - alacritty
        - ghostty

        # Browsers
        - google-chrome

        # Utilities
        - ngrok

        # AI agents
        - claude-code

        # Fonts
        - font-meslo-lg-nerd-font

      mas:
        - { "id": 1569813296, "name": "1Password for Safari" }
        - { "id": 682658836, "name": "GarageBand" }
        - { "id": 1444383602, "name": "Goodnotes" }
        - { "id": 1401495844, "name": "Netler" }
        - { "id": 1507139439, "name": "One Markdown" }
        - { "id": 1596283165, "name": "rcmd" }
        - { "id": 803453959, "name": "Slack" }
        - { "id": 966085870, "name": "TickTick" }
        - { "id": 310633997, "name": "WhatsApp" }

packages:
  common:
    - zsh
  homebrew: []
  homebrew_casks: []
  apt:
  dnf:
  pacman:
  apk:
  mas: []

ignore:
  - .git
  - .gitignore
  - heimdal.yaml
  - .stowrc
  - "*.md"
  - LICENSE
  - .DS_Store
  - .config/yarn/global/node_modules
